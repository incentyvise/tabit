server {
    listen 3003;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json application/manifest+json application/xml+rss image/svg+xml;

    # NOTE: nginx drops server-level add_header directives in any location that
    # declares its own add_header, so each location repeats the headers it needs.

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Service worker, manifest and app shell must always revalidate so updates are picked up.
    location ~ ^/(sw\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Vite's content-hashed bundles: safe to cache forever. Never fall back to
    # index.html for a missing chunk (that yields an HTML-as-JS MIME error).
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @retired_assets;
    }

    # Chunks from previous deploys (see docker/retain-assets.sh), so clients
    # still running an older build can finish loading it.
    location @retired_assets {
        root /var/cache/tab-assets;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Un-hashed public files (icons, splash screens): cache
    # briefly so replacing them actually reaches users.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|txt)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback — shell must stay fresh so clients load the latest app bundle
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
