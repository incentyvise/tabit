server {
    listen 3004;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/json image/svg+xml;

    # NOTE: nginx drops server-level add_header directives in any location that
    # declares its own add_header, so each location repeats the headers it needs.
    # Long-lived Cache-Control headers omit `always` so 404s are never cached
    # (by browsers or Cloudflare).

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Vite's content-hashed bundles. Never fall back to index.html for a missing chunk.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri @missing_static;
    }

    location @missing_static {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 404;
    }

    # Un-hashed public files: short cache.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?|txt)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri @missing_static;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ /index.html;
    }
}
