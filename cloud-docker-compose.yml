# Multi-container deployment (Dokploy compose)
# Domains: api.tabit.in, app.tabit.in, wrk.tabit.in, admin.tabit.in
# Set secrets via Doppler (DOPPLER_TOKEN_* per service) or Dokploy env sync.
# PWA/admin: DOPPLER_TOKEN_PWA / DOPPLER_TOKEN_ADMIN are build args (static Vite bundles); api/workers use tokens at runtime.
# Images use BuildKit cache mounts (Docker 23+ / BuildKit enabled by default).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        - TURBO_TEAM=${TURBO_TEAM}
        - TURBO_TOKEN=${TURBO_TOKEN}
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN_API}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://app.tabit.in}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - VITE_API_URL=${VITE_API_URL:-https://api.tabit.in}
      - BETTER_AUTH_COOKIE_DOMAIN=${BETTER_AUTH_COOKIE_DOMAIN:-.tabit.in}
      - BETTER_AUTH_TRUSTED_ORIGINS=${BETTER_AUTH_TRUSTED_ORIGINS:-https://app.tabit.in}
      - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-https://admin.tabit.in}
      - ADMIN_EMAILS=${ADMIN_EMAILS}
      - WORKERS_HEALTH_URL=${WORKERS_HEALTH_URL:-http://workers:3002/health}
      - PLUNK_SECRET_KEY=${PLUNK_SECRET_KEY}
      - PLUNK_BASE_URL=${PLUNK_BASE_URL}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - NEXT_PUBLIC_PWA_URL=${NEXT_PUBLIC_PWA_URL}
      - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED}
    expose:
      - "3001"
    networks:
      - tabit
    restart: always
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      # api runs DB migrations before listening
      start_period: 60s

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
      args:
        - TURBO_TEAM=${TURBO_TEAM}
        - TURBO_TOKEN=${TURBO_TOKEN}
    environment:
      - DOPPLER_TOKEN=${DOPPLER_TOKEN_WORKERS}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://app.tabit.in}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - NEXT_PUBLIC_PWA_URL=${NEXT_PUBLIC_PWA_URL}
      - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL}
      - APP_URL=${APP_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME_WORKERS}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED}
    expose:
      - "3002"
    networks:
      - tabit
    restart: always
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  pwa:
    build:
      context: .
      dockerfile: apps/pwa/Dockerfile
      args:
        # Vite public env is baked at build time via Doppler (not runtime).
        - DOPPLER_TOKEN=${DOPPLER_TOKEN_PWA}
        - TURBO_TEAM=${TURBO_TEAM}
        - TURBO_TOKEN=${TURBO_TOKEN}
    expose:
      - "3003"
    networks:
      - tabit
    restart: always
    logging: *default-logging

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        - DOPPLER_TOKEN=${DOPPLER_TOKEN_ADMIN}
        - VITE_API_URL=${VITE_API_URL:-https://api.tabit.in}
        - NEXT_PUBLIC_PWA_URL=${NEXT_PUBLIC_PWA_URL:-https://app.tabit.in}
        - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-https://admin.tabit.in}
        - TURBO_TEAM=${TURBO_TEAM}
        - TURBO_TOKEN=${TURBO_TOKEN}
    expose:
      - "3004"
    networks:
      - tabit
    restart: always
    logging: *default-logging

networks:
  tabit:
